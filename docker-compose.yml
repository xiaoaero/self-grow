# ================================================================
# Self Grow — 生产编排
#
# 用法：
#   1. cp .env.example .env        # 至少填 SELF_GROW_JWT_SECRET（+ 改掉 MySQL 口令）
#   2. docker compose up -d --build
#   3. docker compose exec app python tools/init_password.py
#
# ⚠️ 如果服务器上**已经跑过 SQLite 版本**（data 卷里有 data.db），
#    （项目 2026-09-23 起只支持 MySQL；SQLite 通路与 data.db 已移除）
#    历史：切到 MySQL 前必须先迁数据，否则 app 会在空库里重建 22 张表、
#    看起来像「数据全丢了」：
#      docker compose up -d mysql
#      docker compose run --rm app python tools/archive/migrate_sqlite_to_mysql.py
#    （脚本默认读 /data/data.db，与下面的挂载点一致）
#
# 说明见 docs/Docker技术详解与部署实战.md、docs/SQLite迁移MySQL方案.md
# ================================================================

services:
  # ── MySQL（主数据库）───────────────────────────────────────
  # 项目的**唯一**数据库（2026-09-19 迁到 MySQL，2026-09-23 移除 SQLite 通路）。
  #
  # 为什么从 SQLite 换过来：
  #   · app 与 mcp 是**两个进程**写同一份数据，SQLite 只能靠文件锁串行化；
  #     MySQL 是真并发
  #   · 想加索引 / 看执行计划 / 调连接池，SQLite 下没有正规手段
  #
  # ⚠️ 四个必须知道的点：
  #  1. **不对外发布端口** —— 只有 compose 网络内的 app / mcp 连得到。
  #     要用 GUI 连的话，放开下面注释掉的 127.0.0.1:3307 那行；
  #     **别用 3306**，宿主机上往往已经有一个 MySQL 占着。
  #     放开之前先确认口令已改（见第 3 点）。
  #  2. **时区在服务端也设了 +08:00**（`--default-time-zone`），与 app 连接层的
  #     `SET time_zone='+08:00'` 是双保险。本项目全量依赖「本地时间」，
  #     跑 UTC 会重演「刚记录完却显示 8 小时前」的坑（见 docs/时间口径统一方案.md）。
  #  3. **默认口令是占位值，生产必须改**（`openssl rand -hex 16`）。
  #     不发布端口是主要防线，但别把它当唯一防线。
  #  4. **不要删 mysql_data 卷** —— 它就是全部业务数据（SQLite 时代的 data.db）。
  mysql:
    image: mysql:8.0
    container_name: self-grow-mysql
    restart: unless-stopped

    command:
      # 服务端字符集。utf8mb4 才是真·四字节 UTF-8，MySQL 里那个叫 "utf8"
      # 的其实是 3 字节残废版 —— 项目里的 emoji（习惯图标、技能树节点）会插不进去
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00

    # 调试用：只绑回环，且换个端口避开宿主机已有的 3306
    # ports:
    #   - "127.0.0.1:3307:3306"

    environment:
      # 官方镜像首次启动时会用这几项初始化：建库、建用户、授权。
      # 之后改动这些变量**不会**同步到已有数据（要手动改口令）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-self_grow_root_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-self_grow}
      MYSQL_USER: ${MYSQL_USER:-self_grow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-self_grow_pw}
      TZ: ${TZ:-Asia/Shanghai}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      # 用 mysqladmin ping 而不是 TCP 探测：初始化期间 MySQL 会起一个**临时
      # server** 监听 3306，此时 TCP 是通的、SQL 还不能跑。ping 走真实认证握手，
      # 只有真的可用了才成功 —— app 的 depends_on 就靠这个 gate。
      #
      # `$$` 是 compose 的转义，让 shell 在**容器内**取 $MYSQL_ROOT_PASSWORD，
      # 而不是在宿主机上被 compose 展开成空串
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      # 首次启动要初始化数据目录 + 建库建用户，给足时间（实测 15~25s）
      start_period: 40s

    mem_limit: 1g
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # pip 源：国内服务器直连 pypi.org 拉 129 个包要 6 分钟以上且容易断
      # （实测 388 秒后失败）。走镜像源可降到数十秒。
      # 海外机器在 .env 里写 PIP_INDEX_URL=https://pypi.org/simple 即可切回
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: self-grow:1.2
    container_name: self-grow
    restart: unless-stopped

    # 等 MySQL 真正可用再启动。「TCP 通了但 SQL 还不能跑」的那段窗口里
    # app 会建表失败并退出 —— 靠 mysql 的 healthcheck 把这段挡掉
    depends_on:
      mysql:
        condition: service_healthy

    ports:
      # 直连模式（本机/内网）
      - "3001:3001"
      # 公网部署建议改成只绑回环，由 Nginx 对外（同时启用下面注释掉的 nginx 服务）：
      # - "127.0.0.1:3001:3001"

    environment:
      PORT: 3001
      # 时区：容器默认 UTC，而本项目大量依赖本地时间
      # （datetime.date.today()、APScheduler 的 hour=3、MySQL 连接层的 SET time_zone）
      # 不设的后果：定时任务在 UTC 03:00 = 北京时间 11:00 才跑；凌晨 0~8 点「今天」算成前一天
      TZ: ${TZ:-Asia/Shanghai}
      # 数据目录：必须与下面的卷挂载点一致，否则写进容器层（删容器即丢）。
      # 现在只放 uploads/ 与 logs/（业务数据在 MySQL 里）
      SELF_GROW_DATA_DIR: /data
      # 前端目录：留空则后端只提供 API
      SELF_GROW_FRONTEND_DIR: /app/frontend

      # ── 数据库 ────────────────────────────────────────────
      # 只有 MySQL 一条通路（2026-09-23 起）：
      # 原来的 SELF_GROW_DB_BACKEND 开关与 data.db 都已移除，**没有回退选项**。
      # 老部署若还留着那个变量名，启动日志会打一条 WARNING 提示它已废弃。
      # ⚠️ 主机名必须是 **compose 服务名 `mysql`**。
      #    写 127.0.0.1 会指向 app 容器自己 —— 连不上，且报错很难懂
      SELF_GROW_MYSQL_HOST: ${SELF_GROW_MYSQL_HOST:-mysql}
      SELF_GROW_MYSQL_PORT: "3306"
      SELF_GROW_MYSQL_USER: ${MYSQL_USER:-self_grow}
      SELF_GROW_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-self_grow_pw}
      SELF_GROW_MYSQL_DATABASE: ${MYSQL_DATABASE:-self_grow}
      # 连接池上限：**必须 ≥ 并发线程数**。协调 Agent 会用 asyncio.gather
      # 并行跑多个子 Agent，每个工具调用都 to_thread + get_conn()。
      # 池满时 DBUtils 是**无限等待**（无超时）→ 整站卡死。别往下调
      SELF_GROW_MYSQL_POOL_SIZE: "20"

      # ── 必填 ──────────────────────────────────────────────
      # 缺失时 compose 会直接报错拒绝启动（比"启动了但登录 500"好排查）
      SELF_GROW_JWT_SECRET: ${SELF_GROW_JWT_SECRET:?请在 .env 中设置 SELF_GROW_JWT_SECRET（openssl rand -hex 32）}

      # ── 公网部署必填 ──────────────────────────────────────
      # 后端默认只放行 localhost/127.0.0.1，公网访问必须显式填域名
      # 多个来源用逗号分隔；填 * 会关闭凭证支持（等于放弃登录功能）
      SELF_GROW_CORS_ORIGINS: ${SELF_GROW_CORS_ORIGINS:-http://localhost:3001}

      # ── AI（可选，也可在「用户中心 → 模型信息」里配置，存 model_configs 表）──
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}

      # ── AI 咨询外部 API（GitHub 趋势 / 国内 Bocha / 国际 Tavily，均为可选；留空则跳过对应抓取）──
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      # ── 安全开关 ──────────────────────────────────────────
      # 1 = 跳过登录（仅供本地开发/演示），生产必须为 0
      SELF_GROW_TRUSTED_MODE: ${SELF_GROW_TRUSTED_MODE:-0}

      # ── 日志 ──────────────────────────────────────────────
      # 级别：DEBUG / INFO（默认）/ WARNING / ERROR。
      # 改这里重启即生效 —— 以前只能改 config.py 里的 basicConfig（改代码）
      SELF_GROW_LOG_LEVEL: ${SELF_GROW_LOG_LEVEL:-INFO}
      # 日志文件落在 /data/logs/app.log（10MB × 5 轮转）。
      # ⚠️ 不落 /data 卷的话容器一重建日志就没了 —— 别改这个目录
      # 应用日志文件由 services/logging_setup.py 按组件名自动区分，无需在此指定

    volumes:
      # 命名卷：data.db 与 uploads/ 都在这里
      - data:/data

    # 资源上限（按需调整；不设的话一个死循环能拖垮宿主机）
    mem_limit: 1g
    cpus: 1.0

    # 日志滚动，避免单个容器日志撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:3001/api/health', timeout=4)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── MCP Server（可选）：把 24 个业务工具通过 MCP 协议暴露给 AI 客户端 ──
  # 与 app 共用同一个镜像，只是换了启动命令。客户端连接地址：http://host:8000/mcp
  #
  # 三个必须知道的点：
  #  1. **数据库配置必须与 app 完全一致**：MCP 和主站读写的是同一份数据，
  #     配错的话你在 AI 里记的行动，网站上看不到（反过来也一样）。
  #     靠「连同一个 mysql 服务」实现 —— data 卷对业务数据已无意义（只剩 uploads / logs）
  #  2. **必须带 X-API-Key**：只要监听了端口，任何能访问它的人都能调用 24 个写库工具。
  #     Key 在「用户中心 → 账户安全 → API Key（MCP）」生成，可随时撤销
  #  3. **SELF_GROW_TRUSTED_MODE 必须为 0**：为 1 时鉴权中间件会直接放行所有请求
  #
  # 不需要 MCP 就不启动它：`docker compose up -d app`（只点名 app 即可）
  mcp:
    # 复用 app 构建出来的镜像，不重复定义 build（先 docker compose build / up -d --build）
    image: self-grow:1.2
    container_name: self-grow-mcp
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    # 覆盖镜像默认的 `python main.py`
    command: ["python", "mcp_server.py"]

    ports:
      # ⚠️ 只绑回环：公网访问请走 Nginx 反代或 SSH 隧道，别把 8000 直接开到公网。
      # 确实要直连（仅测试）可改成 "8000:8000"，并同步在云控制台放行端口
      - "127.0.0.1:8000:8000"

    environment:
      # 与主站同一个数据目录 + 同一个卷（见下方 volumes）
      # 现在只放 logs/（业务数据在 MySQL 里，通过下面的连接参数访问）
      SELF_GROW_DATA_DIR: /data
      TZ: ${TZ:-Asia/Shanghai}
      # ⚠️ 这几项必须与 app 的**逐字一致**，否则两边看的是不同的库
      SELF_GROW_MYSQL_HOST: ${SELF_GROW_MYSQL_HOST:-mysql}
      SELF_GROW_MYSQL_PORT: "3306"
      SELF_GROW_MYSQL_USER: ${MYSQL_USER:-self_grow}
      SELF_GROW_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-self_grow_pw}
      SELF_GROW_MYSQL_DATABASE: ${MYSQL_DATABASE:-self_grow}
      # MCP 的调用是「一次一个工具」，并发远低于主站；给一半就够
      SELF_GROW_MYSQL_POOL_SIZE: "10"

      # 传输方式：stdio（本地客户端 spawn，无鉴权）/ streamable-http（远程，必须带 Key）
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"

      # 生产必须为 0；为 1 时 MCP 的 API Key 校验会被直接跳过
      SELF_GROW_TRUSTED_MODE: "0"

      # MCP 只用 API Key 鉴权、用不到 JWT，带上是为了与主站环境保持一致
      SELF_GROW_JWT_SECRET: ${SELF_GROW_JWT_SECRET:-}

      # ── 日志 ──────────────────────────────────────────────
      # mcp 与 app 共享同一个 /data 卷，但**写不同的文件**：
      #   app → /data/logs/app.log   mcp → /data/logs/mcp.log
      # （组件名由 mcp_server.py 自己设的 SELF_GROW_LOG_COMPONENT=mcp 决定，
      #   两个进程写同一个文件会互相破坏轮转）
      SELF_GROW_LOG_LEVEL: ${SELF_GROW_LOG_LEVEL:-INFO}

    volumes:
      # 与 app 共享 uploads/ 与 logs/ —— 业务数据在 MySQL 里，不经这个卷
      - data:/data

    # 注意：MCP 没有 /health 路由（访问会 404），别照抄 app 的 healthcheck。
    # 这里只做 TCP 连通性探测：端口能连上就算活着。
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

    mem_limit: 512m
    cpus: 0.5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ── 可选：Nginx 反向代理 + HTTPS（容器版）────────────────────
# 公网部署时启用：
#   1. cp nginx/self-grow.conf.example nginx/self-grow.conf 并填域名
#   2. 申请证书（写到 ./nginx/certs，与下面的挂载点对应）：
#        docker run --rm -it -p 80:80 \
#          -v "$PWD/nginx/certs:/etc/letsencrypt" \
#          certbot/certbot certonly --standalone -d 你的域名
#   3. 把上面 app / mcp 的 ports 都改成只绑回环（如 "127.0.0.1:3001:3001"）
#   4. docker compose --profile with-nginx up -d
#
# ⚠️ nginx 容器里访问后端**必须用 compose 服务名**（app:3001 / mcp:8000），
#    写 127.0.0.1 会指向 nginx 容器自己，必然 502。conf 里已按服务名配好。
#
  # 注意：这个服务加了 profiles，**默认不会启动**（`docker compose up -d` 会忽略它），
  # 必须显式 `--profile with-nginx` 才会拉起 —— 所以没证书时也不会影响日常使用。
  nginx:
    image: nginx:1.27-alpine
    container_name: self-grow-nginx
    restart: unless-stopped
    profiles: ["with-nginx"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/self-grow.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书目录：certbot 写 ./nginx/certs，conf 里读 /etc/letsencrypt/live/...
      - ./nginx/certs:/etc/letsencrypt:ro
    depends_on:
      - app
      - mcp

volumes:
  # uploads/（附件、奖励图片）+ logs/。**不是**业务数据 —— 那在下面的 mysql_data 里
  # ⚠️ 但仍不要随便删：迁移期它里面放过 SQLite 的 data.db，
  #    删了就再也拿不到那份旧快照（`.workbuddy/backup/` 里另有本机副本）
  data:
    # 命名卷（docker volume ls 里显示为 self-grow_data）

  # MySQL 数据目录（docker volume ls 里显示为 self-grow_mysql_data）
  # ⚠️ 这才是 MySQL 模式下的**全部业务数据**。删了这个卷 = 数据没了，
  #    而且它不像 data.db 那样能随手 cp 出来 —— 备份请用 mysqldump：
  #      docker compose exec mysql sh -c \
  #        'mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction \
  #         --databases "$MYSQL_DATABASE"' > backup.sql
  mysql_data:
