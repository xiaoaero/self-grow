[workspace]
authors = ["zhangxiaohang <1811182327@qq.com>"]
channels = ["conda-forge"]
name = "self-grow"
platforms = ["win-64"]
version = "1.1.0"

[tasks]
# 一键运行测试
test = "python -m pytest -q"

# 启动后端（开发模式）
start = "python main.py"

# 导出 pixi 锁定版本到 requirements.txt（pip / Docker 安装用）
# 用法：pixi run export-reqs
export-reqs = "python tools/export_reqs.py"

[dependencies]
python = "3.12.*"
fastapi = ">=0.139.0,<0.140"
uvicorn = ">=0.50.2,<0.51"
httpx = ">=0.28.1,<0.29"
python-dotenv = ">=1.2.2,<2"
apscheduler = ">=3.11.3,<4"
langchain-openai = ">=1.3.5,<2"
pytest = ">=9.1.1,<10"
pillow = ">=12.3.0,<13"
dashscope = ">=1.25.19,<2"
