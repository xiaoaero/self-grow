[workspace]
authors = ["zhangxiaohang <1811182327@qq.com>"]
channels = ["conda-forge"]
name = "self-grow"
platforms = ["win-64"]
version = "1.1.0"

[tasks]
# 一键运行测试
test = "python -m pytest -q"

# 启动后端（开发模式）
start = "python main.py"

# 导出 pixi 锁定版本到 requirements.txt（pip / Docker 安装用）
# 用法：pixi run export-reqs
export-reqs = "python tools/export_reqs.py"

# 启动 MCP Server（stdio，供 Claude Desktop / Cursor 等客户端挂载）
mcp = "python mcp_server.py"

# 初始化 / 重置账号密码（默认 test / admin；也可 pixi run init-password 用户名 新密码）
init-password = "python tools/init_password.py"

[dependencies]
python = "3.12.*"
fastapi = ">=0.139.0,<0.140"
uvicorn = ">=0.50.2,<0.51"
httpx = ">=0.28.1,<0.29"
python-dotenv = ">=1.2.2,<2"
apscheduler = ">=3.11.3,<4"
langchain-openai = ">=1.3.5,<2"
langgraph = ">=0.2.0"
langchain-core = ">=0.3.0"
pytest = ">=9.1.1,<10"
pillow = ">=12.3.0,<13"
dashscope = ">=1.25.19,<2"

# MCP 插件（mcp_server.py 用）—— fastmcp 是 MCP Python SDK v2 的高级封装（PyPI 依赖）
# 登录鉴权（services/auth_service.py 用）—— PyJWT 签发/验签，bcrypt 做密码哈希
# 注：不用 passlib，它与 bcrypt >= 4.1 存在兼容问题（__about__ 已移除），
#     这里直接调用 bcrypt 官方 API，依赖更少也更可控。
[pypi-dependencies]
fastmcp = ">=2.0"
PyJWT = ">=2.8"
bcrypt = ">=4.0"
