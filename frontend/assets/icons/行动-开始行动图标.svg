<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%">
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 500; text-anchor: middle; }
    </style>
  </defs>
  <rect width="540" height="140" fill="#15171c"/>
  
  <!-- 1. 开始行动 -->
  <g transform="translate(20,15)">
    <rect width="80" height="80" rx="18" fill="#0a2626" stroke="#00d9c0" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="28" fill="#0f3d3a"/>
    <path d="M44 16L28 42h12l-4 22 20-26h-12l6-22z" fill="#00d9c0"/>
