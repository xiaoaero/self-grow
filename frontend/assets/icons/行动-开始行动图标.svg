    <rect x="29" y="25" width="22" height="36" rx="2" fill="#f5c96a"/>
    <line x1="33" y1="34" x2="47" y2="34" stroke="#a05f08" stroke-width="2" stroke-linecap="round"/>
    <line x1="33" y1="42" x2="47" y2="42" stroke="#a05f08" stroke-width="2" stroke-linecap="round"/>
    <line x1="33" y1="50" x2="42" y2="50" stroke="#a05f08" stroke-width="2" stroke-linecap="round"/>
    <circle cx="55" cy="26" r="7" fill="#f5a623"/>
    <path d="M52 26l2 2 4-4" fill="none" stroke="#fff8e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="52" width="8" height="14" rx="1" fill="#c4740a"/>
