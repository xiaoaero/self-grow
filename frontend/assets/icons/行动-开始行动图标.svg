    <circle cx="26" cy="56" r="1.5" fill="#e0fffa"/>
    <path d="M18 36c4-4 10-6 14-7M56 24c4 2 7 5 9 9" stroke="#00d9c0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="40" y="100" class="label" fill="#00d9c0">开始行动</text>
  </g>
  
  <!-- 2. 记录努力 -->
  <g transform="translate(130,15)">
    <rect width="80" height="80" rx="18" fill="#2a1e0c" stroke="#f5a623" stroke-width="1.5"/>
