  </g>
  
  <!-- 3. 今日统计 -->
  <g transform="translate(240,15)">
    <rect width="80" height="80" rx="18" fill="#1f1633" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="28" fill="#332355"/>
    <rect x="22" y="52" width="9" height="16" rx="2" fill="#6d3add"/>
    <rect x="35" y="42" width="9" height="26" rx="2" fill="#8b5cf6"/>
    <rect x="48" y="30" width="9" height="38" rx="2" fill="#a78bfa"/>
    <circle cx="26.5" cy="46" r="2" fill="#a78bfa"/>
    <circle cx="39.5" cy="36" r="2" fill="#ddd6ff"/>
    <circle cx="52.5" cy="24" r="2" fill="#ddd6ff"/>
    <path d="M26.5 46l13-10 13-12" fill="none" stroke="#ddd6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
