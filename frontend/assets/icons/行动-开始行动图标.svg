  </g>
  
  <!-- 4. 今日分类分布 -->
  <g transform="translate(350,15)">
    <rect width="80" height="80" rx="18" fill="#2d1512" stroke="#f97066" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="28" fill="#4a201b"/>
    <circle cx="40" cy="40" r="20" fill="none" stroke="#c0392b" stroke-width="6" stroke-dasharray="60 66" transform="rotate(-90 40 40)"/>
    <circle cx="40" cy="40" r="20" fill="none" stroke="#f97066" stroke-width="6" stroke-dasharray="38 88" stroke-dashoffset="-62" transform="rotate(-90 40 40)"/>
    <circle cx="40" cy="40" r="20" fill="none" stroke="#ffaaa3" stroke-width="6" stroke-dasharray="22 104" stroke-dashoffset="-102" transform="rotate(-90 40 40)"/>
    <circle cx="40" cy="40" r="8" fill="#ffddd9"/>
    <circle cx="40" cy="40" r="3" fill="#fff5f4"/>
    <circle cx="22" cy="28" r="2" fill="#ffaaa3"/>
