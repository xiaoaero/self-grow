  </g>
  
  <!-- 5. 最近行动 -->
  <g transform="translate(460,15)">
    <rect width="80" height="80" rx="18" fill="#101b2d" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="28" fill="#182d4d"/>
    <circle cx="40" cy="40" r="18" fill="none" stroke="#3b82f6" stroke-width="4"/>
    <circle cx="40" cy="40" r="18" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="20 93" transform="rotate(-90 40 40)"/>
    <circle cx="40" cy="40" r="4" fill="#dbeafe"/>
    <line x1="40" y1="40" x2="40" y2="28" stroke="#dbeafe" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="40" x2="49" y2="45" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    <rect x="24" y="58" width="32" height="6" rx="3" fill="#3b82f6"/>
    <rect x="26" y="60" width="20" height="2" rx="1" fill="#dbeafe"/>
