<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>技能树查看器</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/detail-panel.css" />
  <style>
    /* 隐藏编辑器专有元素 */
    #toolbar, #sidebar, #ai-panel, #context-menu,
    #node-editor, #settings-modal, #new-tree-modal,
    #btn-undo, #btn-redo, #btn-add-root, #btn-add-child, #btn-delete-selected,
    #btn-import, #btn-export-json, #btn-export-html, #btn-toggle-ai, #btn-settings,
    #new-tree-modal, .toolbar-group::after { display: none !important; }

    /* 查看器专属工具栏 */
    #viewer-toolbar {
      display: flex; align-items: center; gap: 12px; padding: 8px 12px;
      background: var(--bg-secondary); border-bottom: 1px solid var(--border);
      z-index: 100; flex-shrink: 0;
    }
    #viewer-toolbar .title { font-weight: 600; font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #viewer-toolbar .actions { margin-left: auto; display: flex; gap: 4px; align-items: center; }
    #viewer-toolbar .actions button {
      padding: 6px 10px; background: transparent; color: var(--text-secondary);
      border-radius: 6px; border: none; cursor: pointer; font-size: 14px; line-height: 1;
    }
    #viewer-toolbar .actions button:hover { background: var(--border); color: var(--text-primary); }
    #viewer-toolbar .zoom-label { font-size: 12px; color: var(--text-secondary); min-width: 36px; text-align: center; font-family: var(--font-mono); }

    /* 主容器 — 无侧边栏和 AI 面板 */
    #main-container { display: flex; flex: 1; overflow: hidden; }
    #canvas-container { flex: 1; position: relative; overflow: hidden; background: var(--bg-canvas); }

    /* viewer 学习按钮（与编辑器 detail-panel.css 一致） */
    .viewer-learn-btn {
      width: 100%; padding: 10px 16px; border-radius: var(--radius);
      font-size: 14px; font-weight: 500; cursor: pointer; border: none;
      transition: background var(--transition), opacity var(--transition);
      margin-top: 16px;
    }
    .viewer-learn-btn.btn-learn { background: var(--accent); color: #000; }
    .viewer-learn-btn.btn-learn:hover { background: var(--accent-hover); }
    .viewer-learn-btn.btn-learning { background: var(--warning); color: #000; cursor: default; opacity: 0.8; }
    .viewer-learn-btn.btn-completed { background: var(--success); color: #000; }
    .viewer-learn-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 空状态 — 只覆盖 canvas 区域，不破坏 main-container */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%; color: var(--text-muted); gap: 12px;
    }
    .empty-state .icon { font-size: 48px; }
    .empty-state p { font-size: 14px; }

    /* 加载中状态 */
    .loading-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%; color: var(--text-muted); gap: 16px;
    }
    .loading-state .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { font-size: 13px; }
  </style>
</head>
<body>

<!-- 查看器专属工具栏 -->
<div id="viewer-toolbar">
  <span class="title" id="viewer-desc">技能介绍</span>
  <div class="actions">
    <button id="viewer-zoom-in" title="放大">🔍+</button>
    <button id="viewer-zoom-out" title="缩小">🔍-</button>
    <button id="viewer-fit" title="适应窗口">⊞</button>
    <span class="zoom-label" id="viewerZoomLabel">100%</span>
  </div>
</div>

<!-- 主容器 -->
<div id="main-container">
  <!-- 画布 -->
  <div id="canvas-container">
    <div id="tree-canvas">
      <svg id="grid-layer"></svg>
      <svg id="connection-layer"></svg>
      <div id="node-layer"></div>
    </div>
    <div id="canvas-hint">🖱 右键拖拽平移 | 滚轮缩放 | 点击节点查看详情</div>
  </div>

  <!-- 右侧详情面板 -->
  <div class="detail-panel" id="detail-panel">
    <div class="detail-header">
      <span id="detail-title">节点详情</span>
      <button id="btn-close-detail" title="关闭">✕</button>
    </div>
    <div id="detail-content" class="detail-content">
      <div class="detail-empty">点击节点查看详情</div>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/tree-renderer.js"></script>
<script>
/* ================================================================
   查看器 — 复用编辑器渲染引擎，展示已发布版本
   节点不可编辑，可进行学习/完成操作
   ================================================================ */

var treeId = new URLSearchParams(location.search).get('treeId') || 'default';
var userId = new URLSearchParams(location.search).get('userId') || '';

// Key 定义
var publishedKey = treeId + '_published';
var draftKey = 'tree_' + treeId;
var learnerKey = treeId + (userId ? '_learner_' + userId : '_learner');

// 数据状态
var publishedData = null;   // 发布版原始数据（含 learner 快照）
var treeData = null;        // 当前渲染用的树数据（只有 nodes + connections）
var learnerData = {};       // 学习者进度 { nodeId: 0|50|100 }

// 视图状态
var selectedNodeId = null;
var renderer = null;
var viewerScale = 1, viewerPanX = 0, viewerPanY = 0;
var viewerIsPanning = false, viewerPanStart = {x:0,y:0};

/* ================================================================
   数据加载 — 统一入口
   ================================================================ */

/** 从所有可能的数据源加载并合并数据 */
function loadData() {
  // 1. 读取发布版
  publishedData = loadFromStorage(publishedKey);

  // 2. 读取 learner
  learnerData = loadFromStorage(learnerKey, {});

  // 3. 如果有发布版，从发布版取树结构，并合并 learner
  if (publishedData) {
    treeData = {
      name: publishedData.name,
      description: publishedData.description,
      nodes: publishedData.nodes,
      connections: publishedData.connections
    };
    // 合并发布版中保存的 learner 快照（只补缺）
    if (publishedData.learner) {
      Object.keys(publishedData.learner).forEach(function(k) {
        if (learnerData[k] === undefined) {
          learnerData[k] = publishedData.learner[k];
        }
      });
    }
    return true;
  }

  // 4. 无发布版，尝试读草稿版（兼容旧数据）
  var draft = loadFromStorage(draftKey);
  if (draft && draft.nodes && draft.nodes.length > 0) {
    treeData = {
      name: draft.name,
      description: draft.description,
      nodes: draft.nodes,
      connections: draft.connections
    };
    return true;
  }

  return false;
}

/** 将当前 learner 进度写回发布版的 learner 快照 */
function saveLearnerToPublished() {
  if (publishedData) {
    publishedData.learner = JSON.parse(JSON.stringify(learnerData));
    saveToStorage(publishedKey, publishedData);
  }
}

/** 保存 learner 到独立 key */
function saveLearner() {
  saveToStorage(learnerKey, learnerData);
}

/* ================================================================
   初始化渲染
   ================================================================ */

function initViewer() {
  var nodes = treeData.nodes || [];

  // 设置标题栏 — 显示技能介绍，没有则回退到技能名称
  document.getElementById('viewer-desc').textContent = treeData.description || treeData.name || '技能树';

  if (!nodes.length) {
    // 空状态 — 只替换 canvas-container 内容，不破坏 main-container
    var cc = document.getElementById('canvas-container');
    cc.innerHTML = '<div class="empty-state"><div class="icon">🌳</div><p>暂无技能树数据</p></div>';
    return;
  }

  // 给每个节点注入学习状态（基于 learnerData，编辑器 progress 忽略）
  nodes.forEach(function(n) {
    var p = (learnerData && learnerData[n.id] !== undefined) ? learnerData[n.id] : 0;
    n.progress = p;
    n._learningState = p >= 100 ? 'completed' : p > 0 ? 'learning' : 'available';
    n._selected = n.id === selectedNodeId;
    n._highlight = false;
  });

  // 注入连线高亮状态
  var conns = treeData.connections || [];
  var nodeMap = {};
  nodes.forEach(function(n) { nodeMap[n.id] = n; });
  conns.forEach(function(c) {
    var to = nodeMap[c.to];
    c._selected = false;
    c._highlight = to && to._learningState === 'completed';
  });

  // 复用 TreeRenderer — 开启网格，和编辑器一致
  if (!renderer) {
    renderer = new TreeRenderer('canvas-container');
    renderer.showGrid = true;
  }
  renderer.renderGrid(viewerScale, viewerPanX, viewerPanY);
  renderer.renderAllNodes(nodes);
  renderer.renderConnections(conns, nodes);

  viewerFitScreen();

  // 如果已有选中节点，更新详情
  if (selectedNodeId) updateDetailPanel(selectedNodeId);
}

/* ================================================================
   节点选中
   ================================================================ */

function viewerSelectNode(nodeId) {
  if (!treeData || !treeData.nodes) return;
  // 始终选中该节点，不再 toggle 关闭
  selectedNodeId = nodeId;

  treeData.nodes.forEach(function(n) {
    n._selected = n.id === selectedNodeId;
  });

  if (renderer) {
    renderer.renderAllNodes(treeData.nodes);
  }

  updateDetailPanel(selectedNodeId);
}

function viewerCloseDetail() {
  selectedNodeId = null;
  if (treeData && treeData.nodes) {
    treeData.nodes.forEach(function(n) { n._selected = false; });
    if (renderer) renderer.renderAllNodes(treeData.nodes);
  }
  document.getElementById('detail-panel').classList.add('collapsed');
}

/* ================================================================
   详情面板 — 和编辑器的 DetailPanel 完全一致
   ================================================================ */

function updateDetailPanel(nodeId) {
  var panel = document.getElementById('detail-panel');
  var content = document.getElementById('detail-content');
  var title = document.getElementById('detail-title');

  if (!nodeId || !treeData || !treeData.nodes) {
    panel.classList.add('collapsed');
    return;
  }

  var node = treeData.nodes.find(function(n) { return n.id === nodeId; });
  if (!node) { panel.classList.add('collapsed'); return; }

  panel.classList.remove('collapsed');
  title.textContent = '节点详情';

  var p = node.progress || 0;
  var isCompleted = p >= 100;
  var isLearning = p > 0 && !isCompleted;
  var isAvailable = p === 0;
  var stateLabel = isCompleted ? '✅ 已学习' : (isLearning ? '🔄 学习中' : '🔵 可学习');
  var stateClass = isCompleted ? 'status-completed' : (isLearning ? 'status-learning' : 'status-available');

  var prereqs = getPrerequisites(nodeId);
  var prereqsMet = prereqs.length === 0 || prereqs.every(function(p) { return p.completed; });
  var priorityLabel = getPriorityLabel(node.priority);

  var html = '<div class="detail-node-header">';
  html += '<div class="detail-node-icon" style="background:' + (node.color || '#2a2a4a') + ';border-color:' + (node.borderColor || '#444466') + '">' + (node.icon || '📚') + '</div>';
  html += '<div class="detail-node-info"><div class="detail-node-name">' + escapeHtml(node.name) + '</div>';
  html += '<span class="detail-node-status ' + stateClass + '">' + stateLabel + '</span></div></div>';

  if (node.description) {
    html += '<div class="detail-section"><div class="detail-section-title">描述</div>';
    html += '<div class="detail-description">' + escapeHtml(node.description).replace(/\n/g,'<br>') + '</div></div>';
  }

  if (node.tags && node.tags.length > 0) {
    html += '<div class="detail-section"><div class="detail-section-title">标签</div>';
    html += '<div class="detail-tags">' + node.tags.map(function(t){ return '<span class="detail-tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div></div>';
  }

  html += '<div class="detail-section"><div class="detail-section-title">优先级</div>';
  html += '<div class="detail-priority">' + priorityLabel + '</div></div>';

  if (prereqs.length > 0) {
    html += '<div class="detail-section"><div class="detail-section-title">前置条件</div>';
    html += '<div class="prerequisite-list">';
    prereqs.forEach(function(p) {
      html += '<div class="prerequisite-item ' + (p.completed ? 'prereq-met' : 'prereq-unmet') + '" data-node-id="' + p.id + '" style="cursor:pointer;">';
      html += '<span class="prereq-icon">' + (p.completed ? '✅' : '❌') + '</span>';
      html += '<span class="prereq-name">' + escapeHtml(p.name) + '</span></div>';
    });
    html += '</div></div>';
  }

  // 进度条
  html += '<div class="detail-section"><div class="detail-section-title">进度</div>';
  html += '<div style="display:flex;align-items:center;gap:8px">';
  html += '<div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden">';
  html += '<div style="height:100%;width:' + p + '%;background:var(--success);border-radius:3px;transition:width 0.3s"></div></div>';
  html += '<span style="font-size:13px;color:var(--success);font-weight:600">' + p + '%</span></div></div>';

  // 操作按钮（三态）
  html += '<div class="detail-actions" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">';
  if (isCompleted) {
    html += '<button class="viewer-learn-btn btn-completed" onclick="viewerToggleLearning(\'' + node.id + '\')" title="点击取消完成状态">✅ 已完成</button>';
  } else if (isLearning) {
    html += '<button class="viewer-learn-btn btn-learning" disabled>🔄 学习中</button>';
    html += '<button class="viewer-learn-btn btn-completed" onclick="viewerMarkCompleted(\'' + node.id + '\')">✅ 标记为已学</button>';
  } else {
    html += '<button class="viewer-learn-btn btn-learn" onclick="viewerStartLearning(\'' + node.id + '\')">📖 开始学习</button>';
    html += '<button class="viewer-learn-btn btn-completed" onclick="viewerMarkCompleted(\'' + node.id + '\')">✅ 标记为已学</button>';
    if (!prereqsMet) {
      html += '<div class="detail-btn-hint" style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:4px">⛔ 需先完成所有前置条件</div>';
    }
  }
  html += '</div>';

  content.innerHTML = html;

  // 绑定前置条件点击跳转
  var prereqEls = content.querySelectorAll('.prerequisite-item');
  for (var i = 0; i < prereqEls.length; i++) {
    (function(el) {
      el.addEventListener('click', function() {
        var prereqId = el.dataset.nodeId;
        if (prereqId) viewerSelectNode(prereqId);
      });
    })(prereqEls[i]);
  }
}

/* ================================================================
   学习操作
   ================================================================ */

function viewerStartLearning(nodeId) {
  var node = treeData.nodes.find(function(n) { return n.id === nodeId; });
  if (!node) return;
  var prereqs = getPrerequisites(nodeId);
  var prereqsMet = prereqs.length === 0 || prereqs.every(function(p) { return p.completed; });
  if (!prereqsMet) {
    showToast('请先完成所有前置条件', 'error');
    return;
  }
  learnerData[nodeId] = 50;
  saveLearner();
  saveLearnerToPublished();
  node.progress = 50;
  refreshViewer();
}

function viewerMarkCompleted(nodeId) {
  var node = treeData.nodes.find(function(n) { return n.id === nodeId; });
  if (!node) return;
  var prereqs = getPrerequisites(nodeId);
  var prereqsMet = prereqs.length === 0 || prereqs.every(function(p) { return p.completed; });
  if (!prereqsMet) {
    showToast('请先完成所有前置条件', 'error');
    return;
  }
  learnerData[nodeId] = 100;
  saveLearner();
  saveLearnerToPublished();
  node.progress = 100;
  refreshViewer();
  showToast('✅ 已完成：' + node.name);
}

function viewerToggleLearning(nodeId) {
  learnerData[nodeId] = (learnerData[nodeId] || 0) >= 100 ? 0 : 100;
  saveLearner();
  saveLearnerToPublished();
  var node = treeData.nodes.find(function(n) { return n.id === nodeId; });
  if (node) node.progress = learnerData[nodeId];
  refreshViewer();
}

function refreshViewer() {
  initViewer();
  if (selectedNodeId) updateDetailPanel(selectedNodeId);
}

/* ================================================================
   前置条件
   ================================================================ */

function getPrerequisites(nodeId) {
  var conns = (treeData && treeData.connections) || [];
  var nodes = (treeData && treeData.nodes) || [];

  var parentIds = [];
  for (var i = 0; i < conns.length; i++) {
    if (conns[i].to === nodeId) {
      parentIds.push(conns[i].from);
    }
  }

  var result = [];
  for (var j = 0; j < parentIds.length; j++) {
    var parentNode = null;
    for (var k = 0; k < nodes.length; k++) {
      if (nodes[k].id === parentIds[j]) {
        parentNode = nodes[k];
        break;
      }
    }
    if (parentNode) {
      result.push({
        id: parentNode.id,
        name: parentNode.name,
        completed: (learnerData[parentNode.id] || 0) >= 100
      });
    }
  }
  return result;
}

function getPriorityLabel(priority) {
  switch (priority) {
    case 'high': return '🔴 高';
    case 'medium': return '🟡 中';
    case 'low': return '🟢 低';
    default: return '—';
  }
}

/* ================================================================
   缩放/平移
   ================================================================ */

function viewerZoomIn() {
  viewerScale = Math.min(3, viewerScale + 0.15);
  applyViewerTransform();
  if (renderer) renderer.renderGrid(viewerScale, viewerPanX, viewerPanY);
}

function viewerZoomOut() {
  viewerScale = Math.max(0.2, viewerScale - 0.15);
  applyViewerTransform();
  if (renderer) renderer.renderGrid(viewerScale, viewerPanX, viewerPanY);
}

function viewerFitScreen() {
  if (!treeData || !treeData.nodes || !treeData.nodes.length) return;
  var nodes = treeData.nodes;
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.forEach(function(n) {
    var s = n.size || 70;
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + s); maxY = Math.max(maxY, n.y + s);
  });
  var availW = window.innerWidth - 300;
  if (availW <= 0) availW = 800;
  viewerScale = Math.min(availW / (maxX - minX + 120), window.innerHeight / (maxY - minY + 120), 1.5);
  viewerPanX = (availW - (maxX - minX) * viewerScale) / 2 - (minX || 0) * viewerScale;
  viewerPanY = 80 - (minY || 0) * viewerScale;
  applyViewerTransform();
  if (renderer) renderer.renderGrid(viewerScale, viewerPanX, viewerPanY);
}

function applyViewerTransform() {
  var canvas = document.getElementById('tree-canvas');
  if (canvas) {
    canvas.style.transform = 'translate(' + viewerPanX + 'px,' + viewerPanY + 'px) scale(' + viewerScale + ')';
  }
  var label = document.getElementById('viewerZoomLabel');
  if (label) label.textContent = Math.round(viewerScale * 100) + '%';
}

/* ================================================================
   postMessage 通信（iframe 模式）
   ================================================================ */

// 如果在 iframe 中且本地无数据，向父窗口请求
window.addEventListener('message', function(e) {
  var msg = e.data;
  if (!msg) return;

  // 收到数据推送
  if (msg.type === 'skill-viewer-data' && msg.treeId === treeId) {
    // 父窗口推来的 treeData 可能是发布版 {name, nodes, connections, learner, ...}
    // 也可能是草稿版 {name, nodes, connections}
    var src = msg.treeData;
    if (!src) return;

    // 构建 treeData
    treeData = {
      name: src.name,
      description: src.description,
      nodes: src.nodes,
      connections: src.connections
    };

    // learner：优先用父窗口传来的，再合并发布版快照
    learnerData = msg.learnerData || {};

    // 如果 src 自带 learner 字段（发布版），合并
    if (src.learner) {
      Object.keys(src.learner).forEach(function(k) {
        if (learnerData[k] === undefined) {
          learnerData[k] = src.learner[k];
        }
      });
    }

    // 如果有独立发布版数据，也合并 learner 快照
    var localPub = loadFromStorage(publishedKey);
    if (localPub && localPub.learner) {
      Object.keys(localPub.learner).forEach(function(k) {
        if (learnerData[k] === undefined) {
          learnerData[k] = localPub.learner[k];
        }
      });
    }

    // 保存到本地
    if (publishedData) {
      publishedData.learner = JSON.parse(JSON.stringify(learnerData));
      saveToStorage(publishedKey, publishedData);
    }
    saveLearner();

    initViewer();
  }

  // 重新加载
  if (msg.type === 'skill-viewer-reload') {
    if (loadData()) {
      initViewer();
    }
  }
});

// 首次加载：尝试本地数据，若无则请求父窗口
(function boot() {
  var hasData = loadData();

  if (hasData) {
    initViewer();
  } else if (window.parent !== window) {
    // 在 iframe 中且本地无数据，请求父窗口
    document.getElementById('canvas-container').innerHTML =
      '<div class="loading-state"><div class="spinner"></div><p>正在加载技能树...</p></div>';
    window.parent.postMessage({ type: 'skill-viewer-request', treeId: treeId }, '*');
  } else {
    // 独立打开且无数据
    document.getElementById('canvas-container').innerHTML =
      '<div class="empty-state"><div class="icon">🌳</div><p>暂无技能树数据</p></div>';
  }
})();

/* ================================================================
   事件绑定
   ================================================================ */

document.getElementById('viewer-zoom-in').addEventListener('click', viewerZoomIn);
document.getElementById('viewer-zoom-out').addEventListener('click', viewerZoomOut);
document.getElementById('viewer-fit').addEventListener('click', viewerFitScreen);
document.getElementById('btn-close-detail').addEventListener('click', viewerCloseDetail);

// 画布平移
document.addEventListener('mousedown', function(e) {
  if (e.button === 1 || (e.target && (e.target.id === 'canvas-container' || e.target.id === 'tree-canvas' || e.target.closest('#node-layer') || e.target.closest('#connection-layer') || e.target.closest('#grid-layer')))) {
    viewerIsPanning = true;
    viewerPanStart = { x: e.clientX - viewerPanX, y: e.clientY - viewerPanY };
    document.body.style.cursor = 'grabbing';
  }
});
document.addEventListener('mousemove', function(e) {
  if (viewerIsPanning) {
    viewerPanX = e.clientX - viewerPanStart.x;
    viewerPanY = e.clientY - viewerPanStart.y;
    applyViewerTransform();
  }
});
document.addEventListener('mouseup', function() {
  viewerIsPanning = false;
  document.body.style.cursor = '';
});
document.addEventListener('wheel', function(e) {
  if (e.target.closest('.detail-panel')) return;
  e.preventDefault();
  var delta = e.deltaY > 0 ? -0.08 : 0.08;
  var ns = Math.max(0.2, Math.min(3, viewerScale + delta));
  var ratio = ns / viewerScale;
  var container = document.getElementById('canvas-container');
  var r = container ? container.getBoundingClientRect() : {left:0,top:0};
  viewerPanX = e.clientX - r.left - (e.clientX - r.left - viewerPanX) * ratio;
  viewerPanY = e.clientY - r.top - (e.clientY - r.top - viewerPanY) * ratio;
  viewerScale = ns;
  applyViewerTransform();
  if (renderer) renderer.renderGrid(viewerScale, viewerPanX, viewerPanY);
}, { passive: false });

// 节点点击
document.getElementById('node-layer').addEventListener('click', function(e) {
  var nodeEl = e.target.closest('.skill-node');
  if (nodeEl) {
    viewerSelectNode(nodeEl.dataset.id);
  }
});

// Escape 关闭详情
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') viewerCloseDetail();
});
</script>
</body>
</html>
