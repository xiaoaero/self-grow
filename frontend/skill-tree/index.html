<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Skill Tree - 智能知识树生成器</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' fill='none'><circle cx='20' cy='20' r='18' stroke='%234fc3f7' stroke-width='2'/><path d='M12 28 L20 12 L28 28' stroke='%234fc3f7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><circle cx='20' cy='18' r='3' fill='%234fc3f7'/></svg>">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/detail-panel.css" />
  <style>
    /* ====== 用户模式：隐藏编辑 UI ====== */
    body.role-user #sidebar,
    body.role-user #ai-panel,
    body.role-user #context-menu,
    body.role-user #node-editor,
    body.role-user #settings-modal,
    body.role-user #new-tree-modal,
    body.role-user #toolbar { display: none !important; }

    body.role-user #canvas-hint {
      pointer-events: none;
      user-select: none;
    }
    body.role-user #canvas-hint::before {
      content: '🖱 右键拖拽平移 | 滚轮缩放 | 点击节点查看详情';
    }
    body.role-user #canvas-hint .editor-only {
      display: none;
    }

    /* ====== 预览模式：隐藏详情面板和画布提示 ====== */
    body.role-preview #sidebar,
    body.role-preview #ai-panel,
    body.role-preview #context-menu,
    body.role-preview #node-editor,
    body.role-preview #settings-modal,
    body.role-preview #new-tree-modal,
    body.role-preview #toolbar,
    body.role-preview #detail-panel,
    body.role-preview #canvas-hint { display: none !important; }
  </style>
</head>
<body class="">
  <!-- 后端 /api/config.js 动态注入 API_BASE（跨域开发时取不到 → 回落默认端口） -->
  <script src="/api/config.js" onerror="/* 开发模式静默失败 */"></script>
  <!-- 共享鉴权模块：包装 window.fetch 自动带 Authorization，并统一处理 401 -->
  <script src="../js/auth.js"></script>
  <script>
    /* ================================================================
       角色判定 —— 安全改造（2026-09-11）

       旧实现：`?role=` 参数且默认 'admin'，任何人手敲地址即可获得
       管理员能力（垂直越权）。

       新规则：
       1. 角色一律以后端 /api/auth/me 返回为准。URL 的 role 参数只用来区分
          「查看模式」还是「编辑模式」，不再用来决定权限
       2. 编辑模式（默认 / role=admin）必须是 admin，否则拦截
       3. 查看模式（role=user / role=viewer / preview=true）人人可进
       4. 被拦截时不初始化 App —— 不请求、不暴露任何草稿数据

       注意：本脚本在 </body> 之前执行，此时 js/utils.js 尚未加载，
       因此下面直接读 localStorage，不能调用 getCurrentUserId()。
       ================================================================ */
    (function () {
      var params = new URLSearchParams(location.search);
      var roleParam = (params.get('role') || '').toLowerCase();
      var isPreview = params.get('preview') === 'true';
      // 查看模式：显式声明 user/viewer，或预览模式
      var isViewMode = isPreview || roleParam === 'user' || roleParam === 'viewer';

      window.SKILL_TREE_PREVIEW = isPreview;
      window.SKILL_TREE_ROLE_READY = false;   // 角色校验是否完成（完成才允许启动 App）
      window.SKILL_TREE_IS_ADMIN = false;
      window.SKILL_TREE_DENIED = false;

      var bodyClasses = [];
      if (isPreview) bodyClasses.push('role-preview');
      if (isViewMode) {
        bodyClasses.push('role-user');
        document.body.className = bodyClasses.join(' ');
        // 查看模式无需管理员校验，直接放行
        window.SKILL_TREE_ROLE = 'user';
        window.SKILL_TREE_ROLE_READY = true;
        return;
      }

      // 编辑模式：先隐藏编辑 UI，等校验通过再放开（避免闪现工具栏）
      bodyClasses.push('role-checking');
      document.body.className = bodyClasses.join(' ');

      // 直接读 localStorage（utils.js 此时还未加载）
      function readUserId() {
        if (params.get('userId')) return params.get('userId');
        try {
          var raw = localStorage.getItem('sg_user') || localStorage.getItem('currentUser');
          var u = raw ? JSON.parse(raw) : null;
          return u ? u.id : null;
        } catch (e) {
          return null;
        }
      }

      function buildDeniedCard(reason) {
        var box = document.createElement('div');
        box.id = 'skill-tree-denied';
        box.innerHTML =
          '<div class="denied-card">' +
          '<div class="denied-icon">🔒</div>' +
          '<h2>仅管理员可进入技能树编辑器</h2>' +
          '<p class="denied-reason">' + (reason || '当前账号没有编辑权限') + '</p>' +
          '<button class="denied-btn" onclick="window.__deniedBack && window.__deniedBack()">返回技能库</button>' +
          '</div>';
        return box;
      }

      window.__deniedBack = function () {
        if (window.opener) { window.close(); }
        else if (document.referrer) { location.href = document.referrer; }
        else { location.href = '../../index.html'; }
      };

      function denyAccess(reason) {
        window.SKILL_TREE_DENIED = true;
        window.SKILL_TREE_ROLE_READY = false;
        window.SKILL_TREE_ROLE = 'user';
        window.__deniedCard = buildDeniedCard(reason);
        // 页面尚未解析完，真正的渲染放在 DOMContentLoaded（见页尾脚本）
      }

      var userId = readUserId();
      var API_BASE = (window.Auth && window.Auth.API_BASE)
        || window.__SELF_GROW_API_BASE__ || window.API_BASE || 'http://localhost:3001';

      // JWT 改造（2026-09-13）：凭证由 auth.js 的 fetch 包装自动附加。
      // 完全没有 token 时直接引导去登录，不再弹"仅管理员"这种误导性提示。
      if (window.Auth && !window.Auth.isAuthenticated() && !window.Auth.isTrustedMode()) {
        window.Auth.redirectToLogin();
        return;
      }

      if (!userId) {
        denyAccess('未获取到登录身份，请先从首页登录');
        return;
      }

      fetch(API_BASE + '/api/auth/me?user_id=' + encodeURIComponent(userId))
        .then(function (r) {
          if (r.status === 404 || r.status === 401) throw new Error('登录状态无效，请重新登录');
          if (!r.ok) throw new Error('身份校验失败（' + r.status + '）');
          return r.json();
        })
        .then(function (me) {
          if (me && me.is_admin) {
            window.SKILL_TREE_IS_ADMIN = true;
            window.SKILL_TREE_ROLE = 'admin';
            window.SKILL_TREE_ROLE_READY = true;
            document.body.classList.remove('role-checking');
            if (typeof window.__startSkillTreeApp === 'function') window.__startSkillTreeApp();
          } else {
            denyAccess('当前账号「' + ((me && me.name) || '') + '」为普通用户，无编辑器访问权限');
            window.__renderDeniedIfNeeded && window.__renderDeniedIfNeeded();
          }
        })
        .catch(function (e) {
          denyAccess(e && e.message ? e.message : '身份校验失败');
          window.__renderDeniedIfNeeded && window.__renderDeniedIfNeeded();
        });
    })();
  </script>

  <!-- ==================== 顶部工具栏 ==================== -->
  <div id="toolbar">
    <div class="toolbar-group">
      <button id="btn-save" title="保存到草稿">💾 保存</button>
      <button id="btn-publish" title="上线到技能库">🚀 上线</button>
      <button id="btn-update" title="更新已上线版本" disabled>🔄 更新</button>
    </div>
    <div class="toolbar-group">
      <button id="btn-undo" title="撤销 (Ctrl+Z)" disabled>↩</button>
      <button id="btn-redo" title="重做 (Ctrl+Y)" disabled>↪</button>
    </div>
    <div class="toolbar-group">
      <button id="btn-add-root" title="添加根节点">➕ 节点</button>
      <button id="btn-add-child" title="为选中节点添加子节点">➕ 子节点</button>
      <button id="btn-delete-selected" title="删除选中节点 (Delete)">🗑 删除</button>
    </div>
    <div class="toolbar-group">
      <button id="btn-zoom-in" title="放大">🔍+</button>
      <span id="zoom-level">100%</span>
      <button id="btn-zoom-out" title="缩小">🔍-</button>
      <button id="btn-fit" title="适应窗口">⊞</button>
    </div>
    <div class="toolbar-group toolbar-right">
      <button id="btn-toggle-ai" class="active" title="AI 助手面板">🤖 AI助手</button>
      <button id="btn-settings" title="API 设置">⚙️</button>
    </div>
  </div>

  <!-- ==================== 主内容区 ==================== -->
  <div id="main-container">

    <!-- 左侧栏：技能树列表 -->
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/>
            <path d="M12 7C9 7 7 9 7 11"/>
            <circle cx="7" cy="11" r="1.5"/>
            <path d="M12 7c3 0 5 2 5 4"/>
            <circle cx="17" cy="11" r="1.5"/>
            <circle cx="12" cy="15" r="1.5"/>
          </svg>
          技能树
        </span>
        <button id="btn-new-tree-sidebar" title="新建技能树">➕</button>
      </div>
      <div id="tree-list" class="tree-list">
        <!-- 动态渲染 -->
      </div>
    </div>

    <!-- 新建技能树弹窗 -->
    <div id="new-tree-modal" class="modal hidden">
      <div class="modal-content" style="width:400px;">
        <div class="modal-header">
          <span>🌳 新建技能树</span>
          <button class="btn-close-modal">&times;</button>
        </div>
        <div class="modal-body">
          <label>名称</label>
          <input type="text" id="new-tree-name" placeholder="请输入技能树名称..." />
          <label style="margin-top:12px">技能介绍</label>
          <textarea id="new-tree-description" rows="3" placeholder="描述这个技能树的内容和用途..." style="resize:vertical"></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel">取消</button>
          <button id="btn-confirm-new-tree">创建</button>
        </div>
      </div>
    </div>

    <!-- 树画布 -->
    <div id="canvas-container">
      <div id="tree-canvas">
        <!-- 网格背景层 -->
        <svg id="grid-layer"></svg>
        <!-- 框选层 -->
        <svg id="selection-box-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10">
          <rect id="selection-box" style="display:none;fill:rgba(79,195,247,0.12);stroke:#4fc3f7;stroke-width:1.5;stroke-dasharray:4 2" />
        </svg>
        <!-- 连线层 -->
        <svg id="connection-layer"></svg>
        <!-- 节点层 -->
        <div id="node-layer"></div>
      </div>
      <!-- 画布提示 -->
      <div id="canvas-hint">
        <span class="editor-only">🖱 右键拖拽平移 | 滚轮缩放 | 空格+拖拽平移 | Shift+点击多选 | 拖拽节点移动</span>
      </div>
    </div>

    <!-- 右侧详情面板 -->
    <div id="detail-panel" class="detail-panel">
      <div class="detail-header">
        <span id="detail-title">节点详情</span>
        <button id="btn-close-detail" title="关闭">✕</button>
      </div>
      <div id="detail-content" class="detail-content">
        <div class="detail-empty">点击节点查看详情</div>
      </div>
    </div>

    <!-- AI 助手面板 -->
    <div id="ai-panel" class="panel-open">
      <div id="ai-panel-header">
        <span>🤖 AI 助手</span>
        <button id="btn-clear-ai" title="清空对话">🗑</button>
        <button id="btn-minimize-ai" title="折叠面板">−</button>
      </div>
      <div id="ai-chat">
        <div id="ai-messages"></div>
        <div id="ai-quick-actions">
          <button class="ai-quick-btn" data-fill="true" data-prompt="请为主题「」生成一个完整的知识树，包含根节点和3-4层子节点">🎯 生成知识树</button>
          <button class="ai-quick-btn" data-prompt="请为选中的节点扩展3-5个子节点">🌿 扩展子节点</button>
          <button class="ai-quick-btn" data-prompt="请帮我优化当前知识树的结构，使其更合理">🔧 优化结构</button>
        </div>
      </div>
      <div id="ai-input-area">
        <textarea id="ai-input" placeholder="输入指令，让AI帮你操作知识树..." rows="2"></textarea>
        <button id="btn-ai-send">发送</button>
      </div>
    </div>
  </div>

  <!-- ==================== 节点编辑弹窗 ==================== -->
  <div id="node-editor" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span>✏️ 编辑节点</span>
        <button class="btn-close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <label>名称</label>
        <input type="text" id="edit-name" />
        <label>描述</label>
        <textarea id="edit-description" rows="3"></textarea>
        <label>标签（逗号分隔）</label>
        <input type="text" id="edit-tags" />
        <label>颜色</label>
        <input type="color" id="edit-color" />
        <label>图标</label>
        <select id="edit-icon">
          <option value="📚">📚 学习</option>
          <option value="💡">💡 概念</option>
          <option value="🔧">🔧 技能</option>
          <option value="🎯">🎯 目标</option>
          <option value="📊">📊 数据</option>
          <option value="🌟">🌟 核心</option>
          <option value="🔗">🔗 关联</option>
          <option value="⚡">⚡ 关键</option>
          <option value="🏆">🏆 成就</option>
          <option value="📝">📝 笔记</option>
        </select>
        <label>优先级</label>
        <select id="edit-priority">
          <option value="none">无</option>
          <option value="high">🔴 高</option>
          <option value="medium">🟡 中</option>
          <option value="low">🟢 低</option>
        </select>
        <label>学习状态</label>
        <select id="edit-progress">
          <option value="0">未学习</option>
          <option value="50">学习中</option>
          <option value="100">已完成</option>
        </select>
      </div>
      <div class="modal-footer">
        <button id="btn-save-node">保存</button>
        <button class="btn-close-modal">取消</button>
      </div>
    </div>
  </div>

  <!-- ==================== 设置弹窗 ==================== -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span>⚙️ 设置</span>
        <button class="btn-close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <p>后端地址已配置，无需额外设置。</p>
        <p class="hint">如需修改后端地址，请编辑 <code>js/ai-bridge.js</code> 中的 <code>serverUrl</code>。</p>
      </div>
      <div class="modal-footer">
        <button id="btn-save-settings">确定</button>
        <button class="btn-close-modal">取消</button>
      </div>
    </div>
  </div>

  <!-- ==================== 右键菜单 ==================== -->
  <div id="context-menu" class="hidden">
    <div class="context-item" data-action="edit">✏️ 编辑</div>
    <div class="context-item" data-action="add-child">➕ 添加子节点</div>
    <div class="context-item" data-action="connect">🔗 从此节点连线</div>
    <div class="context-separator"></div>
    <div class="context-item" data-action="expand-ai">🤖 AI扩展子节点</div>
    <div class="context-separator"></div>
    <div class="context-item danger" data-action="delete">🗑 删除</div>
  </div>

  <!-- 确认弹窗遮罩层 -->
  <div id="modal-overlay" class="hidden" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.55);z-index:1000;align-items:center;justify-content:center" onclick="if(event.target===this)this.classList.add('hidden')">
    <div class="modal-content" style="width:400px;max-width:90vw;background:#1e1e2e;border:1px solid #2a2a4a;border-radius:12px;overflow:hidden"></div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="hidden"></div>

  <!-- 共享的 SSE 流式读取工具（与主应用同一份实现，避免两处解析逻辑各自腐烂） -->
  <script src="../js/sse.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/history.js"></script>
  <script src="js/tree-renderer.js"></script>
  <script src="js/interaction.js"></script>
  <script src="js/ai-bridge.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/detail-panel.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* ================================================================
       启动编辑器 —— 必须等角色校验通过

       - 查看模式：SKILL_TREE_ROLE_READY 已在头部脚本置为 true，直接启动
       - 编辑模式：由 /api/auth/me 校验通过后回调本函数启动
       - 被拦截（SKILL_TREE_DENIED）：永不启动，页面已替换为无权限提示
       ================================================================ */
    window.__startSkillTreeApp = function () {
      if (window.SKILL_TREE_DENIED || window.__app) return;
      window.__app = new App(window.SKILL_TREE_ROLE || 'user');
    };

    // 校验完成且被拒绝时渲染拦截页（此时页面已解析完毕，可安全清空 body）
    window.__renderDeniedIfNeeded = function () {
      if (!window.SKILL_TREE_DENIED || !window.__deniedCard) return;
      if (document.getElementById('skill-tree-denied')) return;
      document.body.innerHTML = '';
      document.body.className = 'role-denied';
      document.body.appendChild(window.__deniedCard);
    };

    document.addEventListener('DOMContentLoaded', function () {
      if (window.SKILL_TREE_DENIED) {
        window.__renderDeniedIfNeeded();
        return;
      }
      // 查看模式直接启动；编辑模式等 /api/auth/me 回调后再启动
      if (window.SKILL_TREE_ROLE_READY) {
        window.__startSkillTreeApp();
      }
    });
  </script>
</body>
</html>
