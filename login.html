<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Grow - 登录</title>
    <link rel="stylesheet" href="frontend/css/variables.css">
    <link rel="stylesheet" href="frontend/css/layout.css">
    <link rel="stylesheet" href="frontend/css/pages.css">
</head>
<body>

<div class="login-page">
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <svg viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 28 L20 12 L28 28" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="20" cy="18" r="3" fill="currentColor"/>
                </svg>
            </div>
            <h1 class="login-title">Self Grow</h1>
            <p class="login-subtitle">个人成长系统</p>
        </div>

        <p class="login-prompt">选择用户身份</p>

        <div class="login-users" id="login-users">
            <!-- 由 JS 动态渲染 -->
            <div class="login-loading">加载中...</div>
        </div>

        <p class="login-hint">💡 后续版本将支持用户名密码登录</p>
    </div>
</div>

<!-- 背景装饰 -->
<div class="bg-orb bg-orb--1"></div>
<div class="bg-orb bg-orb--2"></div>
<div class="bg-orb bg-orb--3"></div>

<script>
// 动态获取 API_BASE：优先使用后端注入的配置，否则使用默认值
const API_BASE = window.__SELF_GROW_API_BASE__ || 'http://localhost:3001';
</script>
<!-- API 配置：由后端 /api/config.js 动态注入 API_BASE（同源模式由后端 serve，开发模式静默失败） -->
<script src="/api/config.js" onerror="/* 开发模式下 config.js 不可用，使用上面定义的默认值 */"></script>
<script>

async function loadUsers() {
    const container = document.getElementById('login-users');

    try {
        const resp = await fetch(`${API_BASE}/api/users`);
        if (!resp.ok) throw new Error('API 不可用');

        const users = await resp.json();
        container.innerHTML = '';

        users.forEach(user => {
            const isAdmin = user.role === 'admin';
            const card = document.createElement('div');
            card.className = 'login-user-card';
            card.onclick = () => loginUser(user);

            card.innerHTML = `
                <div class="login-user-card__icon">${isAdmin ? '⚙️' : '👤'}</div>
                <div class="login-user-card__info">
                    <div class="login-user-card__name">${user.name}</div>
                    <div class="login-user-card__role">${isAdmin ? '管理员 · 技能树编辑权限' : '普通用户 · 查看与学习'}</div>
                </div>
                <div class="login-user-card__arrow">→</div>
            `;

            container.appendChild(card);
        });
    } catch (e) {
        container.innerHTML = `
            <div class="login-error">
                <p>❌ 无法连接到后端服务</p>
                <p style="font-size:12px;color:#666">请确保后端已启动：<br>cd backend && pixi run python server.py</p>
                <button onclick="loadUsers()" class="login-retry-btn">重试</button>
            </div>
        `;
    }
}

function loginUser(user) {
    setCurrentUser({ id: user.id, name: user.name, role: user.role });
    window.location.href = 'frontend/index.html';
}

function setCurrentUser(user) {
    localStorage.setItem('sg_user', JSON.stringify(user));
}

loadUsers();
</script>

</body>
</html>
